<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07080c" />
    <meta name="robots" content="noindex" />
    <title>Offline · AnyTogether</title>
    <style>
      :root {
        color-scheme: dark;
        --paper: oklch(13% 0.03 264);
        --ink: oklch(96.5% 0.008 260);
        --mute: oklch(71% 0.028 262);
        --rule: oklch(100% 0 0 / 0.1);
        --accent: oklch(76% 0.13 250);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: radial-gradient(90% 60% at 50% 0%, oklch(30% 0.1 262 / 0.55), transparent 70%), var(--paper);
        color: var(--ink);
        font: 16px/1.55 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: oklch(17% 0.034 264);
        box-shadow: 0 0 0 1px var(--rule) inset, 0 24px 48px -20px oklch(58% 0.19 262 / 0.7);
      }
      h1 {
        margin-top: 28px;
        font-size: 26px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 10px;
        color: var(--mute);
        text-wrap: balance;
      }
      .tr {
        margin-top: 26px;
        padding-top: 22px;
        border-top: 1px solid var(--rule);
      }
      .tr h2 {
        font-size: 17px;
        letter-spacing: -0.01em;
      }
      .tr p {
        margin-top: 6px;
        font-size: 15px;
      }
      button {
        margin-top: 30px;
        padding: 12px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--paper);
        font: 600 15px/1 inherit;
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.2s ease;
      }
      button:hover {
        background: var(--ink);
      }
      button:active {
        transform: scale(0.97);
      }
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="32" y2="32">
              <stop stop-color="#4f7cff" />
              <stop offset=".55" stop-color="#b65cff" />
              <stop offset="1" stop-color="#2fe0c4" />
            </linearGradient>
          </defs>
          <circle cx="12" cy="16" r="8.5" stroke="url(#g)" stroke-width="2.5" />
          <circle cx="20" cy="16" r="8.5" stroke="url(#g)" stroke-width="2.5" />
        </svg>
      </span>
      <h1>You are offline</h1>
      <p>AnyTogether needs a connection. It opens again as soon as you are back online.</p>
      <div class="tr" lang="tr">
        <h2>Çevrimdışısın</h2>
        <p>AnyTogether bağlantı gerektirir. Yeniden bağlandığında açılır.</p>
      </div>
      <button type="button" id="again">Try again · Tekrar dene</button>
    </main>
    <script>
      document.getElementById("again").addEventListener("click", () => location.reload());
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
