# Your own AnyTogether on one machine: cp .env.example .env, fill it in, docker compose up -d.
# See docs/self-hosting.md. The optional TURN relay for calls starts with --profile turn, the
# backup service with --profile backup.
name: anytogether

x-node: &node
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anytogether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: anytogether
    volumes: [postgres:/var/lib/postgresql/data]
    # Over TCP: while the first start sets up the database, a temporary server answers on the
    # socket only, and a restore or the API must not reach it before the real one is up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U anytogether -d anytogether"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Rate limits, sign-in challenges, presence and the event bus: nothing that must survive a
  # restart, so nothing is written to disk.
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Runs the database migrations when it starts.
  api:
    <<: *node
    build: { context: .., dockerfile: infra/Dockerfile.node, args: { APP: api } }
    image: anytogether-api:local
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://anytogether:${POSTGRES_PASSWORD}@postgres:5432/anytogether
      VALKEY_URL: redis://valkey:6379
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      SMTP_URL: ${SMTP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-AnyTogether <signin@localhost>}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      GAME_ICON_HOSTS: ${GAME_ICON_HOSTS:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MIN_LAUNCHER_VERSION: ${MIN_LAUNCHER_VERSION:-}
      CLIENT_DOWNLOAD_URL: ${CLIENT_DOWNLOAD_URL:-}
      # Cloud saves and media: off until STORAGE_DIR (the files volume below: /data/files) or the
      # four S3_ settings are set in .env. See docs/self-hosting.md ("Cloud saves and media").
      STORAGE_DIR: ${STORAGE_DIR:-}
      STORAGE_QUOTA_MB: ${STORAGE_QUOTA_MB:-100}
      SAVE_MAX_MB: ${SAVE_MAX_MB:-50}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      FILE_LINK_SECRET: ${FILE_LINK_SECRET:-}
      # What the backup service last did, for the admin page (missing until it runs).
      BACKUP_STATUS_FILE: /data/backup-state/status.json
    # Where cloud saves and media are kept with STORAGE_DIR=/data/files (and where uploads wait
    # while they arrive, with S3 too). The backup service backs it up with the database.
    volumes:
      - files:/data/files
      - backup-state:/data/backup-state:ro
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  realtime:
    <<: *node
    build: { context: .., dockerfile: infra/Dockerfile.node, args: { APP: realtime } }
    image: anytogether-realtime:local
    environment:
      PORT: "8081"
      API_URL: http://api:8080
      VALKEY_URL: redis://valkey:6379
      PUBLIC_URL: https://${DOMAIN}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    <<: *node
    build: { context: .., dockerfile: infra/Dockerfile.web }
    image: anytogether-web:local
    environment:
      PORT: "3000"
      API_URL: http://api:8080
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  # Backups (docker compose --profile backup up -d): the database and the files volume on a
  # schedule, encrypted, to any rclone target (S3, R2, B2, Google Drive, SFTP…) and/or the backups
  # volume. Settings: BACKUP_* and RCLONE_CONFIG_* in .env. See docs/self-hosting.md ("Backups").
  backup:
    <<: *node
    build: { context: .., dockerfile: infra/Dockerfile.backup }
    image: anytogether-backup:local
    profiles: [backup]
    environment:
      DATABASE_URL: postgres://anytogether:${POSTGRES_PASSWORD}@postgres:5432/anytogether
      BACKUP_FILES_DIR: /data/files
      BACKUP_LOCAL_DIR: /backups
      BACKUP_STATE_DIR: /data/backup-state
      # From .env when set there (a name alone passes the value on, and nothing when unset).
      BACKUP_SCHEDULE:
      BACKUP_REMOTE:
      BACKUP_KEEP_LOCAL:
      BACKUP_KEEP_DAILY:
      BACKUP_KEEP_WEEKLY:
      BACKUP_KEEP_MONTHLY:
      BACKUP_AGE_RECIPIENTS:
      BACKUP_AGE_IDENTITY_FILE:
      BACKUP_PASSPHRASE:
      BACKUP_ENCRYPTION:
      BACKUP_ON_START:
      # The rclone remote "offsite" from .env (the docs have examples); a mounted rclone.conf
      # (below) can define any others.
      RCLONE_CONFIG_OFFSITE_TYPE:
      RCLONE_CONFIG_OFFSITE_PROVIDER:
      RCLONE_CONFIG_OFFSITE_ENDPOINT:
      RCLONE_CONFIG_OFFSITE_REGION:
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET:
      RCLONE_CONFIG_OFFSITE_ACCOUNT:
      RCLONE_CONFIG_OFFSITE_KEY:
      RCLONE_CONFIG_OFFSITE_HARD_DELETE:
      RCLONE_CONFIG_OFFSITE_CLIENT_ID:
      RCLONE_CONFIG_OFFSITE_CLIENT_SECRET:
      RCLONE_CONFIG_OFFSITE_SCOPE:
      RCLONE_CONFIG_OFFSITE_TOKEN:
      RCLONE_CONFIG_OFFSITE_ROOT_FOLDER_ID:
      RCLONE_CONFIG_OFFSITE_HOST:
      RCLONE_CONFIG_OFFSITE_PORT:
      RCLONE_CONFIG_OFFSITE_USER:
      RCLONE_CONFIG_OFFSITE_PASS:
      RCLONE_CONFIG_OFFSITE_KEY_PEM:
      RCLONE_CONFIG_OFFSITE_KNOWN_HOSTS_FILE:
      RCLONE_CONFIG_OFFSITE_URL:
      RCLONE_CONFIG_OFFSITE_VENDOR:
      TZ: ${BACKUP_TZ:-UTC}
    volumes:
      - files:/data/files
      - backups:/backups
      - backup-state:/data/backup-state
      # A file of rclone remotes instead of RCLONE_CONFIG_* variables (see the docs), and the age
      # private key for restores only: uncomment and create them first.
      # - ./rclone:/config/rclone
      # - ./age-identity.txt:/run/secrets/age-identity.txt:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # Unhealthy when the last successful backup is older than two schedule periods.
      test: ["CMD", "node", "/app/dist/main.js", "status", "--quiet"]
      interval: 15m
      timeout: 30s
      start_period: 1m
      retries: 1

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      realtime: { condition: service_healthy }
      web: { condition: service_healthy }
    # Caddy's admin endpoint answers once the configuration is loaded.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6

  # STUN/TURN for voice calls behind strict NATs (docker compose --profile turn up -d). It uses
  # the host's network for its UDP port range; TURN_SECRET is shared with the API.
  coturn:
    image: coturn/coturn:4.6
    profiles: [turn]
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
    # With an empty secret anyone could make credentials and relay through this machine.
    entrypoint:
      - sh
      - -c
      - '[ -n "$$TURN_SECRET" ] || { echo "coturn: set TURN_SECRET in .env first" >&2; exit 1; }; exec docker-entrypoint.sh "$$@"'
      - docker-entrypoint.sh
    # The image's entrypoint passes every argument through `echo` (for $(detect-external-ip)),
    # which swallows a lone "-n"; "-c /dev/null" is the same: no config file, flags only.
    command:
      - -c
      - /dev/null
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${DOMAIN}
      - --external-ip=$$(detect-external-ip)
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # Relay only to the internet, never into this machine's or a private network.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  postgres:
  files:
  backups:
  backup-state:
  caddy-data:
  caddy-config:
